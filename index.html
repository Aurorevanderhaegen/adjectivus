    }
    
    document.getElementById("display-name").innerText = playerName;
    document.getElementById("welcome-screen").style.display = "none";

  function loadQuestion() {
    canAnswer = true;
    const q = questions[currentStep];
    
    document.getElementById("step").innerText = currentStep + 1;
    document.getElementById("progress").style.width = ((currentStep) / questions.length) * 100 + "%";

      document.getElementById("feedback-text").style.color = "var(--green)";
    } else {
      btn.classList.add("incorrect");
      buttons[q.answer].classList.add("correct");
      document.getElementById("feedback-text").innerText = "Erreur d'accord !";
      document.getElementById("feedback-text").style.color = "var(--red)";
    }

    document.getElementById("next-btn").style.display = "block";
  }

  function nextQuestion() {
    if (canAnswer) return;
    currentStep += 1;

    if (currentStep < questions.length) {
      loadQuestion();
      document.querySelector(".target-section").scrollTop = 0;
      return;
    }

    document.getElementById("progress").style.width = "100%";
    document.querySelector(".target-section").innerHTML = `
      <div class="end-card">
        <div style="font-size:3rem; margin-bottom:10px;">🏛️ 👑</div>
        <h2>GLORIA, ${playerName} !</h2>
        <p style="margin-top:15px; font-size:1.2rem;">Tu as terminé les 20 épreuves.</p>
        <p style="margin-top:10px; font-size:1.4rem; color:var(--imperial-red);">Score final : <strong>${score} / 2000 SPQR</strong></p>
      </div>
    `;
    document.getElementById("options-container").innerHTML = "";
    document.getElementById("next-btn").style.display = "none";
    document.getElementById("feedback-text").innerText = "Félicitations pour tes révisions !";
  }
</script>
 </body>
</html>
